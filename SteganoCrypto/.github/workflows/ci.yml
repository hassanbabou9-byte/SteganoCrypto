name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev libqt6sql6-sqlite libssl-dev libgl1-mesa-dev pkg-config
      - name: Build
        run: |
          mkdir build && cd build
          qmake6 ../SteganoCrypto.pro
          make -j"$(nproc)"
      - name: Test
        run: cd build && QT_QPA_PLATFORM=offscreen make check
